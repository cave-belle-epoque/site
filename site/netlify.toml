# Si ce dépôt contient aussi docs/ et maquette/ à la racine (voir
# architecture.md §9bis), régler "Base directory" = "site" dans les
# paramètres du site Netlify pour que seul ce dossier soit construit.

[build]
  publish = "_site"
  command = "npm run build"
  functions = "netlify/functions"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Relais OAuth Decap CMS ↔ GitHub (voir netlify/functions/ + docs/architecture.md §4)
[[redirects]]
  from = "/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/callback"
  to = "/.netlify/functions/callback"
  status = 200
